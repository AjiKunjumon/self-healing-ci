name: Self-healing CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COPILOT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with per-test coverage context
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            --cov=. \
            --cov-context=test \
            --cov-report= \
            --json-report \
            --json-report-file=pytest-report.json \
            2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build dynamic source context for failed tests
        if: steps.tests.outputs.status != '0'
        run: python scripts/build_failure_context.py

      - name: Check Copilot token availability
        id: copilot_token
        if: steps.tests.outputs.status != '0'
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: |
          if [[ -n "$COPILOT_AGENT_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "COPILOT_AGENT_TOKEN is unavailable; cloud-agent diagnosis was skipped." >&2
            echo "## Copilot diagnosis skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "A user-to-server token is required. Fork pull requests do not receive repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose failure with GitHub Copilot cloud agent
        if: steps.tests.outputs.status != '0' && steps.copilot_token.outputs.available == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: python scripts/diagnose_failure.py

      - name: Upload diagnosis and failure context
        if: always() && steps.tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ai-diagnosis
          path: |
            ai-diagnosis.json
            failure-context.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail the workflow after diagnosis
        if: steps.tests.outputs.status != '0'
        run: |
          echo "The test suite failed. Review the diagnosis summary and artifact above."
          exit 1
