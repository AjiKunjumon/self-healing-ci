name: Self-healing CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Ollama
        if: steps.tests.outputs.status != '0'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags > /dev/null || {
            cat /tmp/ollama.log
            echo "Ollama did not start in time."
            exit 1
          }
          ollama pull llama3.2:1b

      - name: Diagnose failure with local Llama model
        if: steps.tests.outputs.status != '0'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          OLLAMA_MODEL: llama3.2:1b
        run: python scripts/diagnose_failure.py

      - name: Fail the workflow after diagnosis
        if: steps.tests.outputs.status != '0'
        run: |
          echo "The test suite failed. Review the diagnosis above."
          exit 1
