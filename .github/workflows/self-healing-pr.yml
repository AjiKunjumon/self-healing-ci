name: Self-healing CI - draft repair PR

on:
  workflow_dispatch:
    inputs:
      create_draft_pr:
        description: Propose a constrained repair and open a draft PR if patched tests pass
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-and-propose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COPILOT_BASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline tests and collect per-test coverage
        id: baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --cov=. --cov-context=test --cov-report= \
            --json-report --json-report-file=pytest-report.json 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build dynamic source context
        if: steps.baseline.outputs.status != '0'
        run: python scripts/build_failure_context.py

      - name: Diagnose failure with GitHub Copilot cloud agent
        if: steps.baseline.outputs.status != '0'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: python scripts/diagnose_failure.py

      - name: Generate and validate app.py-only repair with Copilot
        id: patch
        if: steps.baseline.outputs.status != '0' && inputs.create_draft_pr
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: python scripts/propose_and_apply_patch.py

      - name: Re-run tests against proposed patch
        id: patched_tests
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-patch-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create repair PR with clean commit
        id: draft_pr
        if: steps.patch.outputs.applied == 'true' && steps.patched_tests.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Copy repaired files to temporary location before cleaning
          mkdir -p /tmp/repair
          cp app.py /tmp/repair/app.py
          
          # Clean working directory and reset to HEAD
          git reset --hard HEAD
          git clean -fd
          
          # Create repair branch from main (clean slate)
          repair_branch="ai-repair/${{ github.run_id }}"
          git checkout main
          git checkout -b "$repair_branch"
          
          # Restore the repaired app.py
          cp /tmp/repair/app.py app.py
          
          # Include test changes from test/self-healing-failure branch if it exists
          if git rev-parse --verify origin/test/self-healing-failure > /dev/null 2>&1; then
            echo "Merging test changes from test/self-healing-failure branch..."
            git fetch origin test/self-healing-failure
            # Get only test file changes from the test branch
            git checkout origin/test/self-healing-failure -- tests/ 2>/dev/null || true
          fi

          # Verify the repair works with all tests (including new ones from test branch)
          python -m pytest -q 2>&1 | tee pytest-pr-output.txt

          # Stage only the allowlisted application and test files
          git add app.py tests/
          
          # Commit changes with multi-line message
          git commit -m "Propose AI-assisted fix for failing tests" -m "- Fixed app.py based on Copilot analysis" -m "- Included test updates from test/self-healing-failure branch"
          
          # Push branch
          git push -u origin "$repair_branch"
          
          # Get current commit hash for PR creation reference
          commit_sha=$(git rev-parse HEAD)
          echo "pr_branch=$repair_branch" >> "$GITHUB_OUTPUT"
          echo "pr_commit=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        if: steps.draft_pr.outputs.pr_branch != ''
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[AI proposal] Repair failing tests",
              head: "${{ steps.draft_pr.outputs.pr_branch }}",
              base: "main",
              body: "## Copilot-proposed repair\n\nThis draft PR contains the validated fix for `app.py` and test updates from the `test/self-healing-failure` branch. The patched test suite passed in the workflow run.\n\nHuman review is required; passing tests do not prove the change is correct.",
              draft: true
            });
            core.setOutput('pull-request-number', result.data.number);
            core.setOutput('pull-request-url', result.data.html_url);

      - name: Upload diagnosis, context, patch, metrics, and test artifacts
        if: always() && steps.baseline.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-review-${{ github.run_id }}
          path: |
            ai-diagnosis.json
            failure-context.json
            ai-proposed.patch
            repair-metrics.json
            pytest-report.json
            pytest-output.txt
            pytest-patch-output.txt
            pytest-pr-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize and fail unless repair PR was created
        if: always()
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_APPLIED: ${{ steps.patch.outputs.applied }}
          PATCHED_TEST_STATUS: ${{ steps.patched_tests.outputs.status }}
          PR_BRANCH_RESULT: ${{ steps.draft_pr.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          {
            echo '## Self-healing CI result'
            if [[ "$BASELINE_STATUS" == "0" ]]; then
              echo '- Baseline tests passed; no repair was needed.'
            elif [[ "$PATCH_APPLIED" == "true" && "$PATCHED_TEST_STATUS" == "0" && -n "$PR_NUMBER" ]]; then
              echo "- Proposed repair passed tests. Draft PR: #$PR_NUMBER (human review required)."
            elif [[ "$PATCH_APPLIED" == "true" && "$PATCHED_TEST_STATUS" != "0" ]]; then
              echo '- Proposed repair did not pass the full test suite. No PR was created; see pytest-patch-output.txt in the artifact.'
            elif [[ "$PR_BRANCH_RESULT" == "failure" ]]; then
              echo '- Preparing or testing the repair PR branch failed. No PR was created; see the job log and pytest-pr-output.txt if available.'
            else
              echo '- Repair was not completed successfully. See logs and uploaded artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BASELINE_STATUS" != "0" && ( "$PATCH_APPLIED" != "true" || "$PATCHED_TEST_STATUS" != "0" || -z "$PR_NUMBER" ) ]]; then
            exit 1
          fi
