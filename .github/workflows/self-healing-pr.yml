name: Self-healing CI - draft repair PR

on:
  workflow_dispatch:
    inputs:
      create_draft_pr:
        description: Propose a constrained repair and open a draft PR if patched tests pass
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-and-propose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DIAGNOSIS_MODEL: llama3.2:1b
      PATCH_MODEL: qwen2.5-coder:7b
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline tests and collect per-test coverage
        id: baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --cov=. --cov-context=test --cov-report= \
            --json-report --json-report-file=pytest-report.json 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build dynamic source context
        if: steps.baseline.outputs.status != '0'
        run: python scripts/build_failure_context.py

      - name: Install and start Ollama
        if: steps.baseline.outputs.status != '0'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags > /dev/null || { cat /tmp/ollama.log; exit 1; }
          ollama pull "$DIAGNOSIS_MODEL"
          ollama pull "$PATCH_MODEL"

      - name: Diagnose failure
        if: steps.baseline.outputs.status != '0'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/diagnose_failure.py

      - name: Generate and apply allowlisted unified-diff patch
        id: patch
        if: steps.baseline.outputs.status != '0' && inputs.create_draft_pr
        run: python scripts/propose_and_apply_patch.py

      - name: Re-run tests against proposed patch
        id: patched_tests
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-patch-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open draft pull request for human review
        id: draft_pr
        if: steps.patch.outputs.applied == 'true' && steps.patched_tests.outputs.status == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ai-repair/${{ github.run_id }}
          delete-branch: true
          draft: true
          title: "[AI proposal] Repair failing tests"
          commit-message: "Propose AI-assisted fix for failing tests"
          body: |
            ## AI-proposed repair

            This draft PR includes the regression test changes from `test/self-healing-failure` and the proposed AI fix. The changes have passed the test suite.
            Human review is required; passing tests do not prove the change is correct.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload diagnosis, context, patch, metrics, and test artifacts
        if: always() && steps.baseline.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-review-${{ github.run_id }}
          path: |
            ai-diagnosis.json
            failure-context.json
            ai-proposed.patch
            repair-metrics.json
            pytest-report.json
            pytest-output.txt
            pytest-patch-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize and fail unless repair PR was created
        if: always()
        shell: bash
        env:
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          PATCH_APPLIED: ${{ steps.patch.outputs.applied }}
          PATCHED_TEST_STATUS: ${{ steps.patched_tests.outputs.status }}
          PR_NUMBER: ${{ steps.draft_pr.outputs.pull-request-number }}
        run: |
          {
            echo '## Self-healing CI result'
            if [[ "$BASELINE_STATUS" == "0" ]]; then
              echo '- Baseline tests passed; no repair was needed.'
            elif [[ "$PATCH_APPLIED" == "true" && "$PATCHED_TEST_STATUS" == "0" && -n "$PR_NUMBER" ]]; then
              echo "- Proposed repair passed tests. Draft PR: #$PR_NUMBER (human review required)."
            else
              echo '- Repair was not completed successfully. See logs and uploaded artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BASELINE_STATUS" != "0" && ( "$PATCH_APPLIED" != "true" || "$PATCHED_TEST_STATUS" != "0" || -z "$PR_NUMBER" ) ]]; then
            exit 1
          fi
